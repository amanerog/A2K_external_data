# Copy to secret-provider-creds.yaml, fill in real values, `kubectl apply -f`
# it, then flip A2K_BOX_MODE to "live" in configmap.yaml. Do NOT commit the
# filled-in file (deploy/secret-provider-creds.yaml is gitignored already).
#
# Only needed once you have real credentials -- the box runs in mock mode
# without this Secret present.
apiVersion: v1
kind: Secret
metadata:
  name: a2k-box-provider-creds
  namespace: a2k-box
type: Opaque
stringData:
  CALA_API_KEY: "REPLACE_ME"
  SAYARI_CLIENT_ID: "REPLACE_ME"
  SAYARI_CLIENT_SECRET: "REPLACE_ME"
