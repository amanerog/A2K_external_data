AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  a2k cache dashboard (E7.4): the cache metrics a2k-box emits as Embedded
  Metric Format (a2k/cache/metrics.py) plus Logs Insights tables over the
  a2k-box and agent log groups. The tables follow the dashboard's time range.

Parameters:
  DashboardName:
    Type: String
    Default: a2k-cache
  MetricsNamespace:
    Type: String
    Default: A2K/Cache
    Description: CACHE_METRICS_NAMESPACE on the a2k-box Runtime.
  AgentMetricsNamespace:
    Type: String
    Default: A2K/RouterAgent
    Description: A2K_AGENT_METRICS_NAMESPACE on the agent Runtime.
  BoxLogGroup:
    Type: String
    Default: /aws/bedrock-agentcore/runtimes/a2k_cache_mcp-48ImkT2F9a-DEFAULT
  AgentLogGroup:
    Type: String
    Default: /aws/bedrock-agentcore/runtimes/a2k_cache_agent-oEBeCrBECq-DEFAULT
  InfraUSDPerDay:
    Type: String
    Default: 0.14
    Description: >-
      Fixed daily cost of the cache's own infrastructure, prorated -- part of the net cost (T1.3).
      0.14 = Cost Explorer for dev, 1-20 Oct 2026: EU-Aurora ServerlessV2Usage 1.05 + StorageIOUsage 1.65
      + storage/backup 0.02 USD over 20 days; Data API and S3 ~0. Upper bound: the I/O line may include
      another Aurora cluster of the account (0.05/day without it). Re-measure with production traffic.
  LinkupEURPerMonth:
    Type: String
    Default: 5000
    Description: >-
      Linkup's flat rate (a2k/cache/vendor_prices.json contracts): calls avoided save no money, so the
      dashboard shows this amount spread over the questions Linkup answered instead.
  GoNoGoMinAsks:
    Type: String
    Default: 25000
    Description: Asks a domain needs before it can serve from the cache (go / no-go gate 1).
  GroundTruthLogGroup:
    Type: String
    Default: /a2k/cache/ground-truth
    Description: >-
      Where the ground-truth evaluation writes one cache.ground_truth line per domain and run (judge
      precision, go / no-go gate 3). Created by this stack.

Resources:
  GroundTruthLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref GroundTruthLogGroup
      RetentionInDays: 731

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref DashboardName
      DashboardBody: !Sub |
        {
         "start": "-P7D",
         "periodOverride": "inherit",
         "widgets": [
          {
           "type": "text",
           "x": 0,
           "y": 0,
           "width": 24,
           "height": 2,
           "properties": {
            "markdown": "## a2k cache (E7.4)\nMetrics: namespace `${MetricsNamespace}` (EMF lines `cache.metrics` from a2k-box). Tables: Logs Insights over the a2k-box and agent log groups -- they follow the dashboard's time range. Hit rate is over asks with the cache on; *would-hit* is what serve mode would have served (shadow)."
           }
          },
          {
           "type": "text",
           "x": 0,
           "y": 2,
           "width": 24,
           "height": 1,
           "properties": {
            "markdown": "### Go / no-go per domain -- a domain serves only if it passes all four: asks >= ${GoNoGoMinAsks}, re-ask < 5 %, judge precision >= 95 %, net > 0. Set the time range to the start of shadow (30/10) for the cumulative asks."
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 3,
           "width": 24,
           "height": 8,
           "properties": {
            "title": "Go / no-go per domain: asks (>= ${GoNoGoMinAsks}), re-ask % (< 5), judge precision % (>= 95, last ground-truth run), net USD (> 0)",
            "query": "SOURCE '${BoxLogGroup}' | SOURCE '${GroundTruthLogGroup}' | filter event in [\"cache.metrics\", \"cache.ground_truth\"] and ispresent(Domain) and Domain != \"NONE\" | fields coalesce(VendorCostAvoided, 0) + coalesce(AgentCostAvoided, 0) + coalesce(PotentialVendorCostAvoided, 0) + coalesce(PotentialAgentCostAvoided, 0) as saved_usd, coalesce(CostUSD, 0) as cache_usd, toMillis(@timestamp) * Asks as ask_ms | stats sum(Asks) as asks, round(100 * sum(Asks) / ${GoNoGoMinAsks}, 1) as pct_of_min_asks, round(100 * sum(Reformulations) / sum(Asks), 1) as reask_pct, latest(JudgePrecisionPct) as judge_precision_pct, latest(JudgeEvaluated) as judge_evaluated, latest(GroundTruthRun) as ground_truth_run, round(sum(saved_usd) - sum(cache_usd), 2) as net_usd, ceil((${GoNoGoMinAsks} - sum(Asks)) / (sum(Asks) / greatest((max(ask_ms) - min(ask_ms)) / 86400000, 1))) as days_to_min_asks, round(100 * sum(WouldHits) / sum(Asks), 1) as would_hit_pct, round(100 * sum(FalseHits) / sum(ShadowChecks), 1) as false_hit_pct by Domain | filter asks > 0 or ispresent(judge_precision_pct) | sort asks desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "metric",
           "x": 0,
           "y": 11,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Hit rate % (all domains)",
            "view": "timeSeries",
            "stacked": false,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"Hits\"', 'Sum', 300))",
               "id": "h",
               "visible": false
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"WouldHits\"', 'Sum', 300))",
               "id": "wh",
               "visible": false
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"Asks\"', 'Sum', 300))",
               "id": "a",
               "visible": false
              }
             ],
             [
              {
               "expression": "100*h/a",
               "label": "served from cache %",
               "id": "hr"
              }
             ],
             [
              {
               "expression": "100*wh/a",
               "label": "would-hit %",
               "id": "whr"
              }
             ]
            ],
            "period": 300,
            "yAxis": {
             "left": {
              "min": 0,
              "max": 100
             }
            }
           }
          },
          {
           "type": "metric",
           "x": 8,
           "y": 11,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Asks, hits and would-hits",
            "view": "timeSeries",
            "stacked": false,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"Asks\"', 'Sum', 300))",
               "label": "asks",
               "id": "a"
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"Hits\"', 'Sum', 300))",
               "label": "served from cache",
               "id": "h"
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"WouldHits\"', 'Sum', 300))",
               "label": "would-hit",
               "id": "wh"
              }
             ]
            ],
            "period": 300
           }
          },
          {
           "type": "metric",
           "x": 16,
           "y": 11,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Ask latency p50 by where the answer came from (ms)",
            "view": "timeSeries",
            "stacked": false,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "SEARCH('{${MetricsNamespace},ServedFrom} MetricName=\"AskMs\"', 'p50', 300)",
               "id": "p50"
              }
             ]
            ],
            "period": 300
           }
          },
          {
           "type": "metric",
           "x": 0,
           "y": 17,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Admissions by outcome",
            "view": "timeSeries",
            "stacked": true,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "SEARCH('{${MetricsNamespace},Outcome} MetricName=\"Admissions\"', 'Sum', 300)",
               "id": "o"
              }
             ]
            ],
            "period": 300
           }
          },
          {
           "type": "metric",
           "x": 8,
           "y": 17,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Retrieval time p95 (ms) and over the D15 budget",
            "view": "timeSeries",
            "stacked": false,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "MAX(SEARCH('{${MetricsNamespace},Mode} MetricName=\"RetrievalMs\"', 'p95', 300))",
               "label": "retrieval p95 ms",
               "id": "r"
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"OverBudget\"', 'Sum', 300))",
               "label": "over budget",
               "id": "ob",
               "yAxis": "right"
              }
             ]
            ],
            "period": 300
           }
          },
          {
           "type": "metric",
           "x": 16,
           "y": 17,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Errors: cache, cache bypassed, agent",
            "view": "timeSeries",
            "stacked": false,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"Errors\"', 'Sum', 300))",
               "label": "cache errors",
               "id": "e"
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"Skipped\"', 'Sum', 300))",
               "label": "cache bypassed",
               "id": "s"
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${AgentMetricsNamespace},internal_client} MetricName=\"ErrorCount\"', 'Sum', 300))",
               "label": "agent queries with an error",
               "id": "ae"
              }
             ]
            ],
            "period": 300
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 23,
           "width": 12,
           "height": 7,
           "properties": {
            "title": "Per domain: asks, hits, would-hits, re-asks",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" and source = \"cache.retrieval\" | stats sum(Asks) as asks, sum(Hits) as hits, sum(WouldHits) as would_hits, round(100 * sum(Hits) / sum(Asks), 1) as hit_pct, round(100 * sum(WouldHits) / sum(Asks), 1) as would_hit_pct, sum(Reformulations) as reasks, round(100 * sum(Reformulations) / sum(Asks), 1) as reask_pct by Domain | sort asks desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 12,
           "y": 23,
           "width": 12,
           "height": 7,
           "properties": {
            "title": "Per domain: admission outcomes",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" and source = \"cache.admission\" | stats sum(Admissions) as n, round(avg(AdmissionMs) / 1000, 1) as avg_s by Domain, Outcome | sort Domain, n desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 30,
           "width": 12,
           "height": 7,
           "properties": {
            "title": "Why answers are not admitted (top reasons)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.admission\" and outcome != \"ACTIVE\" | stats count(*) as n by outcome, vendor, reason | sort n desc | limit 25",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 12,
           "y": 30,
           "width": 12,
           "height": 7,
           "properties": {
            "title": "Retrieval steps p95 (ms)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.retrieval\" | stats count(*) as asks, pct(timings_ms.normalize_classify, 95) as classify_p95, pct(timings_ms.embed, 95) as embed_p95, pct(timings_ms.reformulation_wait, 95) as reformulation_p95, pct(timings_ms.search, 95) as search_p95, pct(timings_ms.checker, 95) as checker_p95, pct(total_ms, 95) as total_p95 by mode",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 37,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Cache errors, bypasses and exclusions",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.retrieval\" and (error like /./ or skipped like /./ or excluded.0.reason like /./) | stats count(*) as n by error, skipped, excluded.0.reason | sort n desc | limit 20",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 8,
           "y": 37,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Citations dropped (URL no vendor tool returned)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"agent.citations_dropped\" | stats count(*) as answers, sum(dropped) as dropped, sum(of) as of_citations by bin(1d)",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 16,
           "y": 37,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Agent: vendor unavailable and failed tool calls",
            "query": "SOURCE '${AgentLogGroup}' | filter event = \"agent.vendor_unavailable\" or (event = \"agent.tool_call\" and error_type like /./) | stats count(*) as n by event, error_type | sort n desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "text",
           "x": 0,
           "y": 43,
           "width": 24,
           "height": 1,
           "properties": {
            "markdown": "### Cost, size and false hits -- cost is an estimate: tokens x list prices (`CACHE_MODEL_PRICES` overrides them)"
           }
          },
          {
           "type": "metric",
           "x": 0,
           "y": 44,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Model cost of the cache (USD per hour, estimate)",
            "view": "timeSeries",
            "stacked": true,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Outcome} MetricName=\"CostUSD\"', 'Sum', 3600))",
               "label": "admission",
               "id": "a"
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Mode} MetricName=\"CostUSD\"', 'Sum', 3600))",
               "label": "retrieval",
               "id": "r"
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Verdict} MetricName=\"CostUSD\"', 'Sum', 3600))",
               "label": "shadow check",
               "id": "s"
              }
             ]
            ],
            "period": 3600
           }
          },
          {
           "type": "metric",
           "x": 8,
           "y": 44,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Cache size: entries by state",
            "view": "timeSeries",
            "stacked": false,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "SEARCH('{${MetricsNamespace},State} MetricName=\"Entries\"', 'Maximum', 300)",
               "id": "e"
              }
             ]
            ],
            "period": 300
           }
          },
          {
           "type": "metric",
           "x": 16,
           "y": 44,
           "width": 8,
           "height": 6,
           "properties": {
            "title": "Shadow: false-hit rate % (outdated or contradicting)",
            "view": "timeSeries",
            "stacked": false,
            "region": "${AWS::Region}",
            "metrics": [
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Domain} MetricName=\"FalseHits\"', 'Sum', 3600))",
               "id": "f",
               "visible": false
              }
             ],
             [
              {
               "expression": "SUM(SEARCH('{${MetricsNamespace},Domain} MetricName=\"ShadowChecks\"', 'Sum', 3600))",
               "id": "c",
               "visible": false
              }
             ],
             [
              {
               "expression": "100*f/c",
               "label": "false hits %",
               "id": "fr"
              }
             ]
            ],
            "period": 3600,
            "yAxis": {
             "left": {
              "min": 0,
              "max": 100
             }
            }
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 50,
           "width": 8,
           "height": 7,
           "properties": {
            "title": "Cost per admission by outcome, vendor and evidence read (USD)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.admission\" and ispresent(usage.cost_usd) | stats count(*) as n, round(avg(usage.cost_usd), 4) as avg_usd, round(sum(usage.cost_usd), 3) as total_usd, round(avg(usage.input_tokens), 0) as avg_input_tokens by outcome, vendor, evidence.mode | sort total_usd desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 8,
           "y": 50,
           "width": 8,
           "height": 7,
           "properties": {
            "title": "Cache size per domain (latest)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" and source = \"cache.size\" and ispresent(Domain) | stats latest(Entries) as entries by Domain, State | sort Domain, State",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 16,
           "y": 50,
           "width": 8,
           "height": 7,
           "properties": {
            "title": "Shadow checks per domain",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" and source = \"cache.shadow_check\" | stats sum(ShadowChecks) as checks, sum(FalseHits) as false_hits, round(100 * sum(FalseHits) / sum(ShadowChecks), 1) as false_hit_pct by Domain | sort checks desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 57,
           "width": 24,
           "height": 6,
           "properties": {
            "title": "Shadow checks: latest false hits",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.shadow_check\" and verdict in [\"cached_outdated\", \"contradicts\"] | fields @timestamp, domain, verdict, entry_id, cosine, reason | sort @timestamp desc | limit 20",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "text",
           "x": 0,
           "y": 63,
           "width": 24,
           "height": 2,
           "properties": {
            "markdown": "### Saving (T1) -- does the cache pay for itself?\nA hit avoids the vendor tool calls **and** the agent run (a2k/cache/savings.py). *Real*: served from the cache. *Potential*: a would-be hit in shadow -- exactly what this ask's vendor answer took. Vendor cost = calls x `usd_per_call` (a2k/cache/vendor_prices.json, `price_version`); a vendor with no price counts calls, not cost. Cache cost = its model calls + infrastructure (`InfraUSDPerDay` = ${InfraUSDPerDay} USD/day). Net > 0 is gate 3 of the go / no-go. All costs are estimates (tokens and calls x list prices)."
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 65,
           "width": 24,
           "height": 7,
           "properties": {
            "title": "Saving vs cache cost per day (USD, estimate) -- net = saved - cache models - infrastructure",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" | fields coalesce(VendorCostAvoided, 0) + coalesce(AgentCostAvoided, 0) as real_usd, coalesce(PotentialVendorCostAvoided, 0) + coalesce(PotentialAgentCostAvoided, 0) as potential_usd, coalesce(CostUSD, 0) as cache_usd, coalesce(VendorCallsAvoided, 0) as real_calls, coalesce(PotentialVendorCallsAvoided, 0) as potential_calls | stats sum(real_calls) as calls_avoided, sum(potential_calls) as calls_avoided_potential, round(sum(real_usd), 2) as saved, round(sum(potential_usd), 2) as saved_potential, round(sum(cache_usd), 2) as cache_models, round(sum(real_usd) - sum(cache_usd) - ${InfraUSDPerDay}, 2) as net, round(sum(potential_usd) - sum(cache_usd) - ${InfraUSDPerDay}, 2) as net_potential by bin(1d) as day | sort day desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 72,
           "width": 12,
           "height": 7,
           "properties": {
            "title": "Net cost per domain (USD, estimate, without infrastructure)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" | fields coalesce(VendorCostAvoided, 0) + coalesce(AgentCostAvoided, 0) as real_usd, coalesce(PotentialVendorCostAvoided, 0) + coalesce(PotentialAgentCostAvoided, 0) as potential_usd, coalesce(CostUSD, 0) as cache_usd | stats round(sum(real_usd), 2) as saved, round(sum(potential_usd), 2) as saved_potential, round(sum(cache_usd), 2) as cache_models, round(sum(real_usd) - sum(cache_usd), 2) as net, round(sum(potential_usd) - sum(cache_usd), 2) as net_potential by Domain | sort net_potential desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 12,
           "y": 72,
           "width": 12,
           "height": 7,
           "properties": {
            "title": "Calls and cost avoided per domain and vendor (T1.1, T1.2)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" and source = \"cache.retrieval\" and ispresent(PriceVersion) | fields coalesce(VendorCostAvoided, 0) + coalesce(AgentCostAvoided, 0) as real_usd, coalesce(PotentialVendorCostAvoided, 0) + coalesce(PotentialAgentCostAvoided, 0) as potential_usd, coalesce(VendorCallsAvoided, 0) as real_calls, coalesce(PotentialVendorCallsAvoided, 0) as potential_calls | stats count(*) as hits, sum(real_calls) as calls, sum(potential_calls) as calls_potential, round(sum(real_usd), 2) as usd, round(sum(potential_usd), 2) as usd_potential by Domain, AvoidedVendor, PriceVersion | sort usd_potential desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 79,
           "width": 12,
           "height": 7,
           "properties": {
            "title": "Cost per question without vs with the cache, per day (USD, estimate)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" | fields coalesce(AnswerVendorCostUSD, 0) + coalesce(AnswerAgentCostUSD, 0) as answer_usd, coalesce(CostUSD, 0) as cache_usd | stats sum(Asks) as questions, sum(WouldHits) as hits, count(AnswerAgentCostUSD) as priced_answers, round(sum(answer_usd) / count(AnswerAgentCostUSD), 3) as without_cache, round((1 - sum(WouldHits) / sum(Asks)) * sum(answer_usd) / count(AnswerAgentCostUSD) + (sum(cache_usd) + ${InfraUSDPerDay}) / sum(Asks), 3) as with_cache_if_served, round(sum(WouldHits) / sum(Asks) * sum(answer_usd) / count(AnswerAgentCostUSD) - (sum(cache_usd) + ${InfraUSDPerDay}) / sum(Asks), 3) as saving_per_question by bin(1d) as day | sort day desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 12,
           "y": 79,
           "width": 12,
           "height": 7,
           "properties": {
            "title": "Break-even per domain: hits that pay for the cache (USD, estimate, without infrastructure)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" | fields coalesce(AnswerVendorCostUSD, 0) + coalesce(AnswerAgentCostUSD, 0) as answer_usd, coalesce(CostUSD, 0) as cache_usd | stats sum(Asks) as questions, sum(WouldHits) as hits, round(sum(answer_usd) / count(AnswerAgentCostUSD), 3) as saving_per_hit, round(sum(cache_usd), 2) as cache_cost, ceil(sum(cache_usd) / (sum(answer_usd) / count(AnswerAgentCostUSD))) as hits_to_break_even, round(100 * sum(WouldHits) / (sum(cache_usd) / (sum(answer_usd) / count(AnswerAgentCostUSD))), 0) as pct_of_break_even by Domain | sort cache_cost desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "log",
           "x": 0,
           "y": 86,
           "width": 12,
           "height": 6,
           "properties": {
            "title": "Linkup flat rate: effective cost per question it answered (EUR/question, plus the agent in USD)",
            "query": "SOURCE '${BoxLogGroup}' | filter event = \"cache.metrics\" and source = \"cache.retrieval\" and AnswerVendors like /linkup/ | stats count(*) as linkup_answers, sum(AnswerVendorCalls) as vendor_calls, round(${LinkupEURPerMonth} / 30.44 / count(*), 2) as flat_eur_per_answer, round(avg(AnswerAgentCostUSD), 3) as agent_usd_per_answer by bin(1d) as day | sort day desc",
            "region": "${AWS::Region}",
            "view": "table"
           }
          },
          {
           "type": "text",
           "x": 12,
           "y": 86,
           "width": 12,
           "height": 6,
           "properties": {
            "markdown": "#### How to read the cost per question\n- **without_cache**: the average vendor answer (vendor calls + agent run), over the `priced_answers` -- what every question would cost with no cache. Empty until there is a priced answer.\n- **with_cache_if_served**: (1 - hit rate) x that answer + (the cache's models + infrastructure, ${InfraUSDPerDay} USD/day) / questions. Hit rate = hits (served or would-be) / questions, so in shadow it is a projection.\n- **saving_per_question** = without - with: the unit saving of the Business Case. Negative: the cache costs more than it saves at today's hit rate.\n- **Break-even**: `saving_per_hit` is what an average vendor answer costs in the domain, i.e. what one hit avoids; `hits_to_break_even` = cache cost / saving_per_hit. Below 100 % the domain does not pay for itself yet.\n- **Linkup** is a flat rate (${LinkupEURPerMonth} EUR/month): a hit saves its agent run, not the fee. The fee per question only falls with more volume.\n- Answers from a vendor with no price (Sayari) count the agent only."
           }
          }
         ]
        }

Outputs:
