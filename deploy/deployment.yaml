# Prereqs before applying this file (see README "Deploy to EKS"):
#   kubectl apply -f namespace.yaml
#   kubectl apply -f configmap.yaml
#   (optional, once real creds exist) kubectl apply -f secret-provider-creds.yaml
#   replace `image:` below with your pushed ECR image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2k-box
  namespace: a2k-box
  labels:
    app: a2k-box
spec:
  replicas: 2
  selector:
    matchLabels:
      app: a2k-box
  template:
    metadata:
      labels:
        app: a2k-box
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: a2k-box
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/a2k-box:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: a2k-box-config
            - secretRef:
                name: a2k-box-provider-creds
                optional: true # absent while running in mock mode
          volumeMounts:
            - name: audit-scratch
              mountPath: /app/audit
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: audit-scratch
          emptyDir: {}
        - name: tmp
          emptyDir: {}
