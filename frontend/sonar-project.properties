# Overrides this pipeline's org-wide default (sonar.sources=grc, the
# grc/<package> layout other Santander Python projects use) -- this repo
# (front_a2k_ed) has no grc/ folder, the code lives flat at the repo root:
# app.py, a2k_client.py, tests/. Without this file the scan fails with
# "The folder './grc' does not exist for '<projectKey>'" before it ever
# gets to reading coverage.
#
# sonar.projectKey/sonar.host.url/auth are injected by the pipeline itself
# (see the workflow's SONAR_INSTANCES/SONAR_* env vars) -- deliberately not
# set here, this file only fixes what's actually wrong for this project's
# layout.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,**/__pycache__/**,.venv/**,.tmp/**
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.13
