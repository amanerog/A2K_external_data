[project]
name = "front_a2k_ed"
version = "0.0.1"
description = "Frontal A2K external Data"
requires-python = ">=3.13"
# Las dependencias se gestionan en el Pipfile/Pipfile.lock (fuente de verdad
# para el build de Docker, ver Dockerfile) y en requirements.txt (desarrollo
# local, ver README.md "Run locally"). Este bloque queda vacio a proposito:
# `pip install -e .` aqui es solo para tener app.py/a2k_client.py resolubles
# como modulos en modo editable durante desarrollo local (linters, IDEs), no
# para resolver versiones.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# El codigo vive en grc/ (no en el src/ que setuptools autodetecta por
# convencion) -- layout impuesto por el pipeline de Sonar de Santander, que
# pasa -Dsonar.sources=./grc como argumento de linea de comandos y por tanto
# no se puede pisar desde sonar-project.properties (los -D siempre ganan).
# app.py/a2k_client.py siguen siendo modulos sueltos, no un paquete con
# __init__.py -- package-dir los remapea a grc/ sin necesitar convertirlos
# en un paquete real.
package-dir = {"" = "grc"}
py-modules = ["app", "a2k_client"]

[tool.pytest.ini_options]
# tests/ vive en la raiz del repo, no dentro de grc/ (ver sonar.tests en
# sonar-project.properties) -- pythonpath = ["grc"] es lo que permite que
# `import app` / `import a2k_client` resuelvan ahi durante collection sin
# instalar el paquete primero. testpaths acota el descubrimiento a tests/ --
# sin esto, pytest camina todo el repo desde aqui hacia arriba y puede
# recoger test_*.py ajenos (ver el mismo comentario en el pyproject.toml
# raiz).
pythonpath = ["grc"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# Fuente para el informe que Sonar consume (ver README.md "Tests y
# cobertura") -- limitado a los modulos reales de esta app en grc/, no a las
# dependencias instaladas en modo editable ni a los propios tests.
source = ["grc"]
