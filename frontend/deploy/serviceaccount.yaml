# IRSA -- this is what lets the pod's boto3 default credential chain pick up
# real AWS credentials with no code change from local dev (where the same
# chain picks up your own AWS CLI/SSO session instead -- see a2k_client.py's
# own docstring and frontend/README.md's "Why there's a backend at all").
# Fill in <FRONTEND_IAM_ROLE_ARN> with a role trusted by this cluster's OIDC
# provider, granted exactly one permission: bedrock-agentcore:InvokeAgentRuntime
# on a2k-box's MCP Runtime ARN (see frontend/a2k_client.py's AGENT_RUNTIME_ARN).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: a2k-frontend
  namespace: a2k-frontend
  annotations:
    eks.amazonaws.com/role-arn: "<FRONTEND_IAM_ROLE_ARN>"
