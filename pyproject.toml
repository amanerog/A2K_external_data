[project]
name = "a2k-box"
version = "0.1.0"
description = "A2K-KCP gateway box exposing Cala and Sayari third-party company-intelligence data to the K2 agent, over REST and MCP."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=1.2.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a2k_box*"]

[tool.setuptools.package-data]
# Non-.py runtime data: mock fixtures and KB Cards. Without this, a
# non-editable `pip install .` (e.g. in the Docker image) silently omits
# them and the app fails at startup looking for files that "exist locally"
# but never made it into the installed wheel.
a2k_box = ["adapters/fixtures/*.json", "cards/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
